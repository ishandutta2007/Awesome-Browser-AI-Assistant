<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .stat-val {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #38bdf8;
    }
    .stat-lbl {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }

    /* CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .floating-card-1 {
      animation: floatCard 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard 6s ease-in-out infinite 1s;
    }
    .animated-stream {
      stroke-dasharray: 20, 10;
      animation: flowLine 10s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="180" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle class="pulsing-orb-2" cx="1000" cy="300" r="220" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="380" r="150" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Decorative Animated Flow Graphs/Streams in background (behind text) -->
  <path class="animated-stream" d="M -50 320 Q 250 380 500 280 T 1050 340 T 1250 240" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" />
  <path class="animated-stream" d="M -50 120 Q 350 40 700 160 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- Floating Feature Cards (Side Graphic elements) -->
  <g class="floating-card-1" filter="url(#shadow)">
    <rect x="840" y="60" width="310" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Mini browser icon -->
    <rect x="860" y="80" width="36" height="36" rx="8" fill="#6366f1" opacity="0.9" />
    <path d="M870 98 L886 98 M878 90 L878 106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="910" y="94" class="badge-text">In-Browser AI Agents 🤖</text>
    <text x="910" y="114" class="stat-lbl">Autonomous Navigation &amp; DOM Control</text>
    <rect x="860" y="132" width="270" height="6" rx="3" fill="#334155" />
    <rect x="860" y="132" width="190" height="6" rx="3" fill="url(#accentGrad)" />
  </g>

  <g class="floating-card-2" filter="url(#shadow)">
    <rect x="840" y="210" width="310" height="130" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="860" y="240" class="badge-text">Ecosystem Snapshot 📊</text>
    
    <g transform="translate(860, 260)">
      <text x="0" y="18" class="stat-val">100K+</text>
      <text x="0" y="34" class="stat-lbl">GitHub Stars</text>

      <text x="90" y="18" class="stat-val">$3.8B</text>
      <text x="90" y="34" class="stat-lbl">Market Size</text>

      <text x="180" y="18" class="stat-val">100%</text>
      <text x="180" y="34" class="stat-lbl">Local LLM Ready</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header & Subtitle (Completely clear and readable) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)" filter="url(#shadow)">
      <rect width="280" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#10b981" />
      <text x="32" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">OCTOBER 2026 CURATED LIST 🚀</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" class="title" filter="url(#shadow)">
      Awesome Browser <tspan fill="url(#accentGrad)">AI Assistant</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="212" class="subtitle">
      Sidebar AI Assistants, Autonomous Web Agents &amp; Local LLM Integrations
    </text>

    <!-- Tag Pills under subtitle -->
    <g transform="translate(0, 250)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🌐 Web Agents</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="145" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="160" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔒 Privacy-First</text>

      <!-- Pill 3 -->
      <rect x="299" y="0" width="135" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="317" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f43f5e">⚡ Local LLMs</text>

      <!-- Pill 4 -->
      <rect x="446" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="464" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">💡 Open-Source</text>
    </g>

    <!-- Bottom Line Bar -->
    <rect x="0" y="325" width="610" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
