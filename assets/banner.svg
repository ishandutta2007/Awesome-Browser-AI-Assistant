<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".7"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes flowLine{0%{stroke-dashoffset:200}}.badge-text,.stat-lbl,.stat-val,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:48px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.stat-val{font-weight:700;font-size:22px;fill:#38bdf8}.stat-lbl{font-weight:500;font-size:12px;fill:#64748b}.pulsing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.pulsing-orb-2{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:1000px 300px}.floating-card-1{animation:floatCard 5s ease-in-out infinite}.floating-card-2{animation:floatCard 6s ease-in-out infinite 1s}.animated-stream{stroke-dasharray:20,10;animation:flowLine 10s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="180" fill="#6366f1" class="pulsing-orb-1" filter="url(#glow)" opacity=".3"/><circle cx="1000" cy="300" r="220" fill="#a855f7" class="pulsing-orb-2" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="380" r="150" fill="#06b6d4" filter="url(#glow)" opacity=".2"/><g opacity=".08"><path stroke="#fff" stroke-width="1" d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200"/><path stroke="#fff" stroke-width="1" d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400"/></g><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M -50 320 Q 250 380 500 280 T 1050 340 T 1250 240" class="animated-stream" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 120 Q 350 40 700 160 T 1250 80" class="animated-stream" opacity=".3"/><g class="floating-card-1" filter="url(#shadow)"><rect width="310" height="110" x="840" y="60" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="14"/><rect width="36" height="36" x="860" y="80" fill="#6366f1" opacity=".9" rx="8"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.5" d="M870 98 L886 98 M878 90 L878 106"/><text x="910" y="94" class="badge-text">In-Browser AI Agents 🤖</text><text x="910" y="114" class="stat-lbl">Autonomous Navigation &amp; DOM Control</text><rect width="270" height="6" x="860" y="132" fill="#334155" rx="3"/><rect width="190" height="6" x="860" y="132" fill="url(#accentGrad)" rx="3"/></g><g class="floating-card-2" filter="url(#shadow)"><rect width="310" height="130" x="840" y="210" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="14"/><text x="860" y="240" class="badge-text">Ecosystem Snapshot 📊</text><g><text x="0" y="18" class="stat-val" transform="translate(860, 260)">